<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDT Klinik Eğitim Kitabı</title>
<style>:root{--ink:#172439;--muted:#64748b;--line:#e2e8f0;--accent:#a23e36;--paper:#fff;--bg:#f6f7f8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:15px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}header b{letter-spacing:.01em}header small{color:var(--muted)}main{max-width:1220px;margin:36px auto;display:grid;grid-template-columns:255px minmax(0,1fr);gap:30px;padding:0 22px}nav{position:sticky;top:20px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}nav strong{font-size:14px;color:var(--muted)}nav button{display:block;width:100%;padding:9px 12px;margin-top:5px;text-align:left;border:0;border-radius:6px;background:transparent;font:inherit;color:var(--ink);cursor:pointer}nav button.active{background:#f6e9e7;color:#872c27;font-weight:650}article{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:45px 55px;min-height:70vh}h1{font-family:Georgia,serif;font-size:37px;line-height:1.2}h2{font-family:Georgia,serif;font-size:28px;margin:10px 0 18px}h3{margin-top:29px}p{margin:12px 0}ul{padding-left:23px}li{margin:8px 0}.kicker{color:var(--accent);font-size:13px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase}.hint{border-left:3px solid var(--accent);background:#faf6f4;padding:16px 19px;margin:25px 0}.table{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:10px;text-align:left}th{background:#f5f6f8}details{border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin:12px 0}summary{cursor:pointer;font-weight:650}.foot{color:var(--muted);font-size:13px;margin-top:35px;border-top:1px solid var(--line);padding-top:16px}a{color:#8c342f}@media(max-width:800px){main{display:block;margin:12px auto;padding:0 10px}nav{position:static;margin-bottom:12px;padding:12px}nav button{display:inline-block;width:auto;font-size:13px}article{padding:26px 22px}h1{font-size:28px}}@media print{header,nav{display:none}main{display:block;margin:0}article{border:0;padding:0}}</style></head><body>
<header><b>BDT <small> / Klinik Eğitim Kitabı</small></b><small>26 Ekim 2026 · Taslak v0.1</small></header>
<main><nav><strong>BÖLÜMLER</strong><div id="menu"></div></nav><article id="content"></article></main>
<script>
const chapters=[
["Başlangıç","<span class='kicker'>Klinik eğitim</span><h1>Bilişsel Davranışçı Terapi</h1><p>Değerlendirme, terapötik işbirliği ve klinik formülasyon üzerine özgün, düzenlenebilir eğitim notları.</p><div class='hint'>Bu taslak, paylaşılan Eylül 2026 eğitim materyallerinin temel başlıklarından oluşturulmuştur. Kaynak PDF'ler ve özel görüşme transkriptleri yayımlanmaz. Kurgusal örnekler gerçek vakalardan ayrıdır.</div><h3>Öğrenme hedefleri</h3><ul><li>Tanısal değerlendirmeyi psikoterapi amaçlı değerlendirmeden ayırmak.</li><li>İlk görüşmede hastanın hedeflerini ve motivasyonunu belirlemek.</li><li>Düşünce, duygu, bedensel tepki ve davranışı işlevsel bir döngüde göstermek.</li><li>Hasta ile işbirliği içinde ölçülebilir hedef geliştirmek.</li></ul>"],
["01 · Değerlendirme","<span class='kicker'>Bölüm 01</span><h2>Psikiyatrik değerlendirme ve BDT</h2><p>Psikiyatrik tanılar, belirtileri klinik olarak anlamlandıran sınıflandırmalardır. Psikoterapi değerlendirmesinde tanının yanında yakınmanın hastaya özgü anlamı, bağlamı, davranışsal sonuçları ve sürdürücü etkenleri araştırılır.</p><h3>Görüşme akışı</h3><ol><li>Geliş biçimi, hastanın beklentisi ve görüşmeye onay.</li><li>Yakınmaların hastanın kendi sözcükleriyle tanımlanması.</li><li>Başlangıç, süre, seyir, tetikleyiciler ve etkileyen koşullar.</li><li>Önceki tedavi deneyimi, özgeçmiş ve soygeçmiş.</li><li>Ruhsal durum muayenesi, risk ve ayırıcı tanı.</li><li>Ortak problem listesi ve sonraki görüşmenin planı.</li></ol><div class='hint'>Kaynak temeli: Olga Güriz, Psikiyatrik Öykü Alma; Hakan Türkçapar, Psikolojik Bozuklukların Tanı ve Değerlendirilmesi.</div>"],
["02 · Terapötik ilişki","<span class='kicker'>Bölüm 02</span><h2>Terapötik ittifakın kurulması</h2><p>İşbirliği yalnızca danışanın terapisti sevmesi değildir. Güvenli ilişki, hedefler ve görevler konusunda ortaklaşabilmeyi de içerir.</p><h3>Motivasyonu düşük hastada</h3><ul><li>Başvuru kararının kime ait olduğunu açıkça sor.</li><li>Hasta ile yakınlarının sorun tanımlarını birbirine karıştırma.</li><li>Haklı-haksız tartışmasına girmek yerine yaşanan sonuçları keşfet.</li><li>Değiştirilebilir etki alanını birlikte tanımla.</li><li>Tedaviyi zorunlu kabul yerine işbirliğine dayalı bir deneme olarak sun.</li></ul><details><summary>Örnek terapist ifadesi</summary><p>“Yakınlarınızın bu konuda kaygılı olduğunu duyuyorum. Siz kendi hayatınızda neyin farklı olmasını isterdiniz?”</p></details><div class='hint'>Kaynak temeli: Hakan Türkçapar, Psikoterapide Temel İlkeler ve Terapötik İlişki; ilk görüşme cevap anahtarı.</div>"],
["03 · Bilişsel model","<span class='kicker'>Bölüm 03</span><h2>Olay, yorum, duygu ve davranış</h2><p>BDT formülasyonu, yaşanan olayların tek başına sonuçları belirlediğini varsaymaz. Hastanın o olayı nasıl yorumladığı ve nasıl yanıt verdiği araştırılır.</p><div class='table'><table><tr><th>Basamak</th><th>Kurgusal örnek</th></tr><tr><td>Olay</td><td>Arkadaşın mesajı yanıtlamaması</td></tr><tr><td>Otomatik düşünce</td><td>“Beni önemsemiyor.”</td></tr><tr><td>Duygu</td><td>Üzüntü, öfke</td></tr><tr><td>Davranış</td><td>İlişkiyi kesme</td></tr><tr><td>Olası sürdürücü etki</td><td>Alternatif açıklamayı öğrenme fırsatının azalması</td></tr></table></div><p>Bu model görüşmede hastayla sınanacak bir hipotezdir; klinisyenin tek taraflı ilan edeceği gerçek değildir.</p>"],
["04 · Olgu formülasyonu","<span class='kicker'>Bölüm 04</span><h2>İşbirliğine dayalı formülasyon</h2><p>Bir örnek olay seçin ve şu alanları sırayla doldurun: tetikleyici, anlamlandırma, duygular, bedensel belirtiler, baş etme davranışı, kısa ve uzun vadeli sonuçlar.</p><div class='hint'>İndirilebilir/yeniden kullanılabilir Markdown şablonu: <a href='docs/klinik-formulasyon.md'>Klinik formülasyon çalışma sayfası</a>.</div><h3>Formülasyonun kontrolü</h3><ul><li>Hasta anlatılan döngüyü kendisine uygun buluyor mu?</li><li>Henüz bilinmeyenler açıkça işaretlendi mi?</li><li>Öngörü sınanabilir mi?</li><li>Hedef, hastanın kişisel önceliğine bağlı mı?</li></ul>"],
["05 · Örnek görüşme","<span class='kicker'>Bölüm 05</span><h2>Öfke ve kişilerarası çatışma: kurgusal vaka</h2><p>Hasta, sorunun tamamen çevresindeki insanların davranışlarından kaynaklandığını düşünür. Görüşmenin amacı bu yargıyı doğrudan çürütmek değildir.</p><p><b>Hasta:</b> “İnsanlar değişmedikçe hiçbir şey düzelmez.”</p><p><b>Terapist:</b> “Bunun sizi ne kadar zorladığını anlamak istiyorum. Bu yaşantının gününüzü ve ilişkilerinizi nasıl etkilediğine bakalım mı?”</p><p>Odağın dış dünyadan hastanın deneyimine kayması, hastayı suçlamakla aynı şey değildir.</p><p><a href='docs/ornek-vaka.md'>Ayrıntılı vaka ve süpervizyon soruları</a></p>"],
["06 · Klinik uygulama","<span class='kicker'>Bölüm 06</span><h2>Birinci görüşme kontrol listesi</h2><ul><li>Görüşmenin amacı ve sınırları belirtildi.</li><li>Hastanın geliş motivasyonu öğrenildi.</li><li>Hasta tarafından önemli görülen iki veya üç sorun belirlendi.</li><li>Gerekli risk değerlendirmesi gerçekleştirildi.</li><li>Somut bir yakın tarihli olay örneği incelendi.</li><li>Birlikte çalışma hedefi oluşturuldu.</li><li>Bir sonraki görüşmenin odağı netleştirildi.</li></ul><h3>Tekrar soruları</h3><details><summary>Neden haklılık tartışmasına girilmemeli?</summary><p>Hakemlik, ittifakı zayıflatabilir ve hastanın yaşayabildiği değişime ilişkin ortak bir çalışma alanı oluşturmayı geciktirebilir.</p></details><details><summary>Formülasyon tanı mıdır?</summary><p>Hayır. Tanı, sendrom ve ayırıcı tanı değerlendirmesidir; formülasyon ise bu kişide belirtilerin hangi süreçlerle ortaya çıkıp sürdüğüne ilişkin bireysel hipotezdir.</p></details>"],
["Kaynak ve etik","<span class='kicker'>Kaynak düzeni</span><h2>Kaynak haritası ve kullanım sınırı</h2><p>Bu metin kişiye özel BDT eğitim materyallerinden hareketle özgün olarak yazılmıştır. Telifli PDF, slayt görselleri ve özel görüşme metinleri bu GitHub dalına aktarılmamıştır.</p><p><a href='docs/kaynak-haritasi.md'>Eğitim günleri ve konu haritası</a></p><p>Kaynak materyaldeki klinik ifadeler güncel bir kılavuz doğrulaması yerine geçmez. Hasta verileri yayımlanmamalıdır.</p>"]
];
const menu=document.getElementById("menu"),view=document.getElementById("content");
chapters.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c[0];b.onclick=()=>show(i);menu.appendChild(b)});
function show(i){view.innerHTML=chapters[i][1]+"<div class='foot'>BDT Klinik Eğitim Kitabı · Özgün çalışma taslağı · v0.1</div>";[...menu.children].forEach((x,j)=>x.classList.toggle("active",j===i));location.hash="bolum-"+i;scrollTo(0,0)}
show(Math.max(0,Math.min(chapters.length-1,parseInt(location.hash.replace("#bolum-",""))||0)));
</script></body></html>
