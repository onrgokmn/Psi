<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDT Klinik Eğitim Kitabı</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f7f6;color:#1e293b;line-height:1.72}header{background:white;border-bottom:1px solid #ddd;padding:16px 5%;display:flex;justify-content:space-between}header b{font-size:18px}main{max-width:1230px;margin:32px auto;display:grid;grid-template-columns:295px minmax(0,1fr);gap:22px;padding:0 18px}nav{background:white;border:1px solid #e1e5e9;border-radius:9px;padding:16px;align-self:start;position:sticky;top:18px;max-height:90vh;overflow:auto}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;color:#334155;cursor:pointer;border-radius:5px;font:inherit;font-size:13px}nav button.sel{background:#f7e9e7;color:#95362e;font-weight:bold}article{background:white;border:1px solid #e1e5e9;border-radius:9px;padding:45px 55px;min-height:75vh}h1,h2{font-family:Georgia,serif;line-height:1.25}h1{font-size:38px}h2{font-size:28px;margin-top:35px}h3{font-size:18px;margin-top:25px}.eyebrow{font-size:12px;color:#a23f34;text-transform:uppercase;letter-spacing:.1em;font-weight:700}.sub{font-size:13px;color:#64748b;margin-bottom:30px}.note{background:#fbf6f3;border-left:3px solid #a23f34;padding:16px;margin:20px 0}.diagram{border:1px solid #ddd;background:#f8fafc;text-align:center;padding:28px 15px;border-radius:8px;font-weight:650;line-height:2.3;white-space:pre-line}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border:1px solid #dbe1e7;padding:11px;vertical-align:top}th{background:#f1f4f6}a{color:#913f35}details{border:1px solid #e2e8f0;padding:12px;border-radius:7px;margin-bottom:12px}summary{cursor:pointer;font-weight:650}.q{border-top:1px solid #ddd;padding:18px 0}.q button{display:block;margin:7px 0;background:#f8fafc;border:1px solid #dce1e5;border-radius:5px;padding:9px 12px;text-align:left;cursor:pointer;width:100%;font-size:14px}.q button.correct{background:#e0f4e8;border-color:#64a77f}.q button.wrong{background:#fde8e8;border-color:#d68b8b}.toolbar{display:flex;justify-content:space-between;gap:10px}input{padding:8px;border:1px solid #ddd;border-radius:5px;min-width:0;width:100%}@media(max-width:850px){main{display:block;margin:12px auto;padding:0 10px}nav{position:static;max-height:210px;margin-bottom:12px}article{padding:24px 20px}h1{font-size:28px}}@media print{nav,header,.toolbar{display:none}main{display:block}article{border:0;padding:0}}</style></head><body><header><b>BDT | Klinik Eğitim Kitabı</b><span>v0.2 · 2026</span></header><main><nav><div class="toolbar"><input id="search" placeholder="Bölüm ara..." aria-label="Bölüm ara"></div><div id="menu"></div></nav><article id="view"></article></main><script>
const chapters=[{"t":"1. Gün · BDT ve değerlendirme","src":"Türkçapar, 1. gün 1–2","body":"<h2>Psikoterapinin kapsamı</h2><p>Psikoterapi; sözel iletişim ve etkileşimle psikolojik sıkıntı, düşünce ve davranış örüntülerini ele alan, eğitim ve mesleki yetkinlik gerektiren bir müdahaledir. BDT öğrenme kuramları ve bilişsel psikoloji temelinde gelişmiş, kuram ile gözlenen davranışı ilişkilendiren bir yaklaşımdır.</p><h2>Tanı ve olgu formülasyonu</h2><p>Türkçapar'ın sunumunda psikiyatrik tanı kategorilerinin doğal sınıflarla tam örtüşmeyebileceği, sınırların klinik pratikte bulanıklaştığı vurgulanır. Tanı, 'hangi sendrom?' sorusuna; formülasyon ise 'bu kişide, hangi koşullarda, nasıl sürüyor?' sorusuna yanıt arar.</p><table><tr><th>Tanısal değerlendirme</th><th>BDT değerlendirmesi</th></tr><tr><td>Süre, belirti kümesi, dışlama, ayırıcı tanı</td><td>Tetikleyici olay, anlam, davranış, pekişme ve bağlam</td></tr><tr><td>Klinik sınıflandırma</td><td>Hasta ile sınanabilir, bireysel hipotez</td></tr></table><h3>Uygulama sorusu</h3><p>'Depresyon tanısı' ile 'eleştiriyi değersizlik olarak yorumlama ve geri çekilme döngüsü' neden aynı açıklama düzeyinde değildir?</p>"},{"t":"1. Gün · Psikiyatrik muayene","src":"Türkçapar, 1. gün 2; Olga Güriz","body":"<h2>Değerlendirme çerçevesi</h2><p>Öykü hastanın kendi ifadesiyle başlar; başlangıç, seyir, tetikleyici, işlev kaybı, önceki tedavi, kişisel ve aile öyküsü izlenir. Ruhsal durum muayenesi görünüm, davranış, konuşma, duygudurum/duygulanım, düşünce, algı, biliş, içgörü ve yargılamayı içerir.</p><h3>Örnek soru düzeni</h3><ol><li>“Size nasıl yardımcı olabilirim?”</li><li>“Bu durum en son ne zaman yaşandı?”</li><li>“O anda aklınızdan ne geçti?”</li><li>“Ne yaptınız; hemen ardından ne oldu?”</li><li>“Bir değişiklik olsa günlük yaşamınızda ne fark ederdiniz?”</li></ol><div class=\"note\">Risk değerlendirmesi görüşmenin doğal ama ayrı bir bileşenidir. Gerektiğinde intihar düşüncesi, plan, niyet, erişim, önceki girişim, koruyucular ve acil müdahale gerekliliği ayrıca değerlendirilir.</div>"},{"t":"2. Gün · Duygudurum","src":"Sargın, 2. gün","body":"<h2>Depresif ve bipolar belirtilerin ayrımı</h2><p>Kaynak sunum depresif bozukluklar ile bipolar ve ilişkili bozuklukları ayrı ele alır. Depresyon değerlendirmesinde çökkünlük, ilgi kaybı, bilişsel-bedensel değişiklikler, işlevsellik ve intihar riski; bipolar spektrumda yükselmiş/irritabl duygudurum, enerji-aktivite değişimi, dönem süresi ve geçmiş dönem öyküsü incelenir.</p><h3>BDT açısından önemli fark</h3><p>Depresif bir döngüde geri çekilme, kısa vadede zorlayıcı uyaranı azaltıp uzun vadede ödüllendirici etkinlikleri kısıtlayabilir. Hipomanik/manik belirtilerde ise uyku azalması, hızlanma ve risk alma, yalnızca negatif otomatik düşünce anlatısıyla açıklanmamalıdır; tanısal yeniden değerlendirme gerekir.</p><div class=\"note\">Slaytlardaki tarihsel prevalans ve risk oranları burada güncel epidemiyolojik sayı olarak sunulmamıştır. Tanı ve tedavi kararlarında güncel ölçütler esas alınmalıdır.</div><h3>Klinik örnek</h3><p>İki haftadır işe gitmeyen ve artık hiçbir şeyden keyif almadığını söyleyen hastada davranışsal etkinlik düzeyini incelemek yararlıdır; eş zamanlı mani/hipomani ve intihar riski sorgusu ihmal edilmemelidir.</p>"},{"t":"2. Gün · Madde, dissosiyasyon, bedensel belirtiler","src":"Sargın, 2. gün","body":"<h2>Davranışı işlevsel açıdan anlamak</h2><p>Sunumda kullanım, bağımlılık (addiction) ve fizyolojik bağımlılık (dependence) ayrımı yapılır. BDT görüşmesinde istek (craving), tetikleyiciler, kısa süreli pekiştirici sonuçlar ve uzun vadeli zararlar somut olaylarla araştırılır.</p><p>Dissosiyatif belirtilerde yaşantının bağlamı, amnezi, gerçekdışılık ve eşlik eden riskler; bedensel belirtilerde belirtilerle ilişkili dikkat, yorumlama, güvence arama ve kaçınma ele alınabilir. Organik nedenler yalnızca psikolojik formülasyona dayanılarak dışlanmaz.</p><h3>Kurgusal örnek</h3><p>Yoğun kaygı sonrası tekrarlayan acil başvurusu olan hastada “bedenimdeki her değişim ciddi hastalık demek” varsayımı, sık kontrol ve kısa süreli rahatlama örüntüsü bir işlevsel hipotez olabilir.</p>"},{"t":"3–4. Gün · Anksiyete ve panik","src":"Altınöz, 3–4. gün","body":"<h2>Kaygının sürdürücü döngüsü</h2><p>Belirli bedensel belirtilerin felaket olarak yorumlanması, o belirtilere dikkat artışı, güvenlik davranışları ve kaçınma birbirini besleyebilir. Panik değerlendirmesinde atağın beklenmedik olup olmadığı, tekrar etme korkusu ve davranış değişikliği ayrıca sorgulanır.</p><div class=\"diagram\">Bedensel duyum → Tehdit yorumu → Kaygı artışı → Daha yoğun bedensel duyum → Kaçınma / güvenlik davranışı</div><h3>Kurgusal diyalog</h3><p><b>Hasta:</b> “Kalbim hızlanınca kesin kalp krizi geçiriyorum.”</p><p><b>Terapist:</b> “Bu düşünce geldiğinde ne yapıyorsunuz ve hemen sonrasında kaygınız nasıl değişiyor?”</p><p>Bu ilk adım, yorumun doğru/yanlış olduğuna hemen hükmetmeden döngüyü haritalamaktır.</p>"},{"t":"3–4. Gün · OKB, travma ve kişilik","src":"Altınöz, 3–4. gün","body":"<h2>OKB'de değerlendirme</h2><p>Obsesyonların içeriği, sıklığı, sıkıntı, nötralizasyon ve ritüellerin işlevi belirlenir. Zihinsel kompulsiyonlar ve güvence arama, yalnızca görünür davranışların sorgulanmasıyla kaçabilir.</p><h2>Travma ile ilişkili belirtiler</h2><p>İstemsiz yeniden yaşantılama, travma hatırlatıcılarından kaçınma, olumsuz biliş ve duygudurum değişiklikleri, aşırı uyarılmışlık ile işlev kaybı birlikte ele alınır. Travma ayrıntılarını ilk görüşmede zorla anlattırmak değerlendirme hedefi değildir.</p><h2>Kişilik özellikleri</h2><p>Tek bir görüşmede etiket koymak yerine, uzun süreli kişilerarası örüntüler, bağlamlar arası süreklilik, işlevsellik ve gelişimsel öykü değerlendirilir. Özelliği kişinin tüm kimliğiyle eşitlemek ittifakı zayıflatabilir.</p>"},{"t":"3–4. Gün · Yapılandırılmış değerlendirme","src":"Altınöz, 3–4. gün","body":"<h2>Yapılandırılmış ve yarı yapılandırılmış görüşmeler</h2><p>Standart sorular tanısal tutarlılığı destekleyebilir; klinik muayenenin ve bireysel formülasyonun yerini almaz. Sunumda geniş belirti taramasına yönelik ölçekler de ele alınmaktadır.</p><h3>Pratik akış</h3><ol><li>Başvuru yakınması ve klinik risk.</li><li>Sendrom taraması ve ayırıcı tanı.</li><li>Şiddet/işlevsellik ölçümü.</li><li>Somut örnek olay seçimi.</li><li>Hasta ile ortak problem listesi.</li></ol><div class=\"note\">Ölçek puanı tek başına tanı koydurmaz; kullanılan sürüm, geçerlik, kesme puanı ve uygulama amacı belirtilmelidir.</div>"},{"t":"5. Gün · Kültürel duyarlılık","src":"Batmaz, 5. gün 1","body":"<h2>Bireysel bağlamı görünür kılmak</h2><p>Sunum araştırma örneklemlerindeki WEIRD (Batılı, eğitimli, sanayileşmiş, zengin, demokratik) ağırlığını ve kültürel bağlamın terapiye taşınması gereğini vurgular.</p><h3>Değerlendirme alanları</h3><ul><li>Hastanın tercih ettiği dil ve kullanılan kavramlar.</li><li>Kültürel değerler, aile ve topluluk beklentileri.</li><li>Dinî/manevi uygulamaların hasta için anlamı.</li><li>Toplumsal eşitsizlik, göç, ayrımcılık ve ekonomik stresörler.</li><li>Terapistin kendi varsayımlarının formülasyonu nasıl etkilediği.</li></ul><p>“Bu sizin için ne anlama geliyor?” sorusu, kültürel genellemelerden daha güvenilir bir başlangıçtır.</p>"},{"t":"5. Gün · Etik ilkeler ve ikilemler","src":"Batmaz, 5. gün 2–3","body":"<h2>Temel etik gerilimler</h2><p>Yararlı olma, zarar vermeme, özerkliğe saygı, adalet, gizlilik, mesleki sınırlar ve yetkinlik temel başlıklardır. Sunumdaki olgular gizlilik, üçüncü kişiden bilgi alma, ağır risk, sınır ihlali ve görüşme süresi gibi durumları tartışmaya açar.</p><h3>Karar çerçevesi</h3><ol><li>Etik ve klinik olguyu tanımla.</li><li>Hasta özerkliği, güvenlik ve üçüncü kişilerin haklarını belirle.</li><li>Mevzuat ve meslek ilkelerini değerlendir.</li><li>Süpervizyon/konsültasyon al.</li><li>Kararı ve gerekçesini kaydet.</li></ol><details><summary>Etik vaka: Aileden gelen bilgi</summary><p>Yetişkin danışanın yakını görüşme öncesi mahrem bilgi vermek ister. Terapist hastanın gizlilik beklentisini, bilgiyi alma amacını, olası acil güvenlik gerekçelerini ve açık iletişimi ayrı değerlendirmelidir. Tek bir evrensel çözüm tüm durumlar için uygun değildir.</p></details>"},{"t":"6. Gün · Terapötik işbirliği","src":"Türkçapar, 6. gün; görüşme cevap anahtarı","body":"<h2>Öfke ve dışsallaştırma ile çalışma</h2><p>Görüşme cevap anahtarına göre terapist başvurunun yakınların isteğiyle yapılmasını direnç olarak etiketlemez; hastayı ikna etmeye veya haklılık-haksızlık hakemliğine soyunmaz. Hasta için anlamlı olan öfke, üzüntü ve ilişkilerden kopma örüntüsüne odaklanır.</p><div class=\"diagram\">Hasta anlatısını anla → Sıkıntıyı tanımla → Etki alanını keşfet → Ortak amaç kur → Deneme çerçevesi sun</div><h3>Öğretici ayrım</h3><p>Empati, hastanın duygusal deneyimini anlamak; onaylama, yaşantıyı anlaşılır kılmak; her inancı gerçek kabul etmek ise bunlardan farklıdır.</p><p>İzleme kılavuzu ayrıca “ne istemiyorum / ne istiyorum” ayrımı, futbol metaforu ve dil düzeyindeki “gerekiyor / istiyorum” karşılaştırmasıyla çalışmayı örneklendirir. Bu materyallerin her biri kendi bağlamında okunmalıdır.</p>"},{"t":"6. Gün · Klinik mikrobeceriler","src":"Türkçapar, 6. gün; görüşme izleme kılavuzu","body":"<h2>Yanıt biçimleri</h2><table><tr><th>İşlev</th><th>Örnek ifade</th></tr><tr><td>Yansıtma</td><td>“Bu durumda kendinizi değersiz hissetmişsiniz.”</td></tr><tr><td>Özetleme</td><td>“Bir yanda öfke, diğer yanda ilişkilerden uzaklaşma var.”</td></tr><tr><td>İşbirliği</td><td>“İlk hangisini ele almak istersiniz?”</td></tr><tr><td>Kontrol alanı</td><td>“Başkalarının kararlarından ayrı olarak sizin seçebileceğiniz bir adım var mı?”</td></tr></table><p>Örnek ifadeler özgün eğitim örnekleridir; gerçek transkriptten alınmış doğrudan alıntılar değildir.</p><h3>Süpervizyon kontrolü</h3><ul><li>Terapist hastanın konuşmasını yapılandırırken susturuyor mu?</li><li>Öğretme/ikna etme ihtiyacı ittifakın önüne geçiyor mu?</li><li>Hastanın değişim hedefi terapistin hedefinden ayrılabiliyor mu?</li></ul>"},{"t":"Klinik vaka laboratuvarı","src":"Özgün eğitim örnekleri","body":"<h2>Vaka A: depresif geri çekilme</h2><p>28 yaşındaki kurgusal hastada başarısızlık beklentisi nedeniyle sosyal davetlerden kaçınma, kısa vadede sıkıntıyı azaltıp uzun vadede yalnızlığı pekiştiriyor olabilir. İlk hipotez, duygu ve davranış takibiyle sınanır.</p><h2>Vaka B: panik ve kontrol</h2><p>Bedensel duyumları tehdit olarak yorumlayan kurgusal hasta kalabalık yerlerden uzaklaşır. Güvenlik davranışlarının kısa süreli faydasını ve uzun dönem etkisini birlikte haritalayın.</p><h2>Vaka C: ilişkisel çatışma</h2><p>Yakınlarının yönlendirmesiyle gelen hastanın değişim motivasyonu sınırlıdır. Öfkenin işlevsel sonuçlarına ve kişinin istediği yaşama odaklanın.</p><h3>Ödev</h3><p>Her vakada tetikleyici, otomatik düşünce, duygu, davranış, kısa süreli sonuç, uzun vadeli sonuç ve ortak hedefi ayrı yazın.</p>"},{"t":"Formülasyon ve algoritmalar","src":"Kaynaklardan türetilen öğretici şema","body":"<h2>Görüşme akış şeması</h2><div class=\"diagram\">Başvuru ve rıza<br>↓<br>Risk ve tanısal değerlendirme<br>↓<br>Somut örnek olay<br>↓<br>Bilişsel-davranışsal döngü<br>↓<br>Ortak hedef ve izlem</div><h3>İşlevsel analiz şablonu</h3><table><tr><th>Durum</th><th>Yorum</th><th>Duygu</th><th>Davranış</th><th>Sonuç</th></tr><tr><td>Eleştiri almak</td><td>“Yetersizim”</td><td>Utanç</td><td>Geri çekilme</td><td>Kısa süreli rahatlama, uzun süreli yalnızlaşma</td></tr></table><div class=\"note\">Bu şemalar genel öğretim amaçlıdır; kişiye özgü terapötik planın yerini tutmaz.</div>"},{"t":"Soru bankası","src":"Özgün eğitim soruları","body":"<h2>Kendini değerlendir</h2><div id=\"quiz\"></div>"},{"t":"Kaynaklar ve kullanım","src":"13 PDF eğitim paketi","body":"<h2>Kaynak eşlemesi</h2><p>1. gün Hakan Türkçapar (iki sunum); 2. gün Ahmet Emre Sargın; 3–4. gün Ercan Altınöz; 5. gün Sedat Batmaz (üç sunum); 6. gün Hakan Türkçapar; Olga Güriz psikiyatrik öykü alma; 6. gün soru formu, cevap anahtarı, transkript ve izleme kılavuzu.</p><p>Kaynaklardaki materyal ile burada yeniden yazılan klinik öğretim örnekleri farklıdır. Kişiye özel ve çoğaltılması yasak kaynakların PDF'leri ve transkriptleri yayımlanmamaktadır.</p><p>Öğretim taslağı v0.2; epidemiyolojik rakamlar ve yerel mevzuat bağımsız güncellik doğrulamasından geçirilmemiştir.</p><p><a href=\"docs/kaynak-haritasi.md\">Ayrıntılı kaynak haritası</a> · <a href=\"docs/klinik-formulasyon.md\">Formülasyon formu</a> · <a href=\"docs/ornek-vaka.md\">Kurgusal vaka</a></p>"}];
const questions=[["Bir hastanın 'eşim değişmeden iyi olmam imkânsız' ifadesine ilk yaklaşım?","Sorunun hastanın yaşantısındaki etkisini keşfetmek","Eşinin hatalı olduğunu onaylamak","Hastayı hemen çürütmek"],["BDT formülasyonu nedir?","Sınanabilir kişiye özgü sürdürücü etken hipotezi","Tanı kodunun eş anlamlısı","Yalnızca kişilik testi"],["Panikte güvenlik davranışı ne yapabilir?","Kısa vadeli rahatlama sağlarken uzun vadede korkuyu sürdürebilir","Mutlaka panik atağı tamamen ortadan kaldırır","Tek başına tanıyı kanıtlar"],["İlk görüşmede risk değerlendirmesi için hangisi doğrudur?","Klinik gerekliliğe göre açıkça değerlendirilmelidir","İttifakı bozmamak için hiç sorulmamalıdır","Yalnızca ölçekle yapılmalıdır"],["Kültürel duyarlılıkta ilk yaklaşım?","Hastanın anlam dünyasını ve tercihlerini keşfetmek","Aynı kültürden herkesi aynı kabul etmek","Kültürü değerlendirme dışı bırakmak"],["Etik ikilemde hangisi uygundur?","Mevzuat, hasta hakları ve süpervizyonu birlikte ele almak","Tek bir soyut ilkeyi mutlak uygulamak","Kararı kayda geçirmemek"],["Tanı ile formülasyon arasında fark nedir?","Tanı sendromu; formülasyon bireysel mekanizmayı değerlendirir","Aynı kavramlardır","Formülasyon yalnız ilaç seçimidir"],["Motivasyonu düşük hastayla ilk görüşmede?","Geliş nedenini kabul etmek ve kişinin hedefini araştırmak","Tedaviye zorunlu uyumu dayatmak","Hastayı dirençli diye tanımlamak"],["OKB değerlendirmesinde neler sorulur?","Obsesyon, kompulsiyon ve nötralizasyon işlevi","Yalnızca görünür el yıkama","Yalnızca depresyon süresi"],["Travma değerlendirmesinde?","Güvenliği ve belirtileri değerlendirerek ilerlemek","Bütün travma ayrıntılarını ilk seansta zorlamak","Kaçınmayı sorgulamamak"]];
const menu=document.getElementById("menu"),view=document.getElementById("view");
function renderMenu(search=""){menu.innerHTML="";chapters.forEach((c,i)=>{if(!c.t.toLowerCase().includes(search.toLowerCase()))return;let b=document.createElement("button");b.textContent=c.t;b.onclick=()=>show(i);b.dataset.i=i;menu.append(b)})}
function show(i){const c=chapters[i];view.innerHTML='<div class="eyebrow">BDT değerlendirme eğitimi</div><h1>'+c.t+'</h1><div class="sub">Kaynak dayanağı: '+c.src+'</div>'+c.body+'<p class="sub" style="border-top:1px solid #ddd;padding-top:22px;margin-top:50px">Özgün eğitim çalışması · Telifli PDF ve özel görüşme metinleri yayımlanmamıştır.</p>';document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("sel",Number(b.dataset.i)===i));location.hash="bolum-"+i;if(c.t==="Soru bankası")buildQuiz();window.scrollTo(0,0)}
function buildQuiz(){const el=document.getElementById("quiz");questions.forEach((q,i)=>{const d=document.createElement("div");d.className="q";let answers=q.slice(1);d.innerHTML="<b>"+(i+1)+". "+q[0]+"</b>";answers.forEach((a,j)=>{let b=document.createElement("button");b.textContent=a;b.onclick=()=>{d.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add(j===0?"correct":"wrong");if(j!==0)d.querySelector("button").classList.add("correct")};d.appendChild(b)});el.append(d)})}
document.getElementById("search").oninput=e=>renderMenu(e.target.value);renderMenu();show(Math.max(0,Math.min(chapters.length-1,Number(location.hash.replace("#bolum-",""))||0)));
</script></body></html>
